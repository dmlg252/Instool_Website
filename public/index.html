<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTOOL</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f5; }
        ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
        body { font-size: 14px; }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-900 font-sans antialiased h-screen flex flex-col overflow-hidden select-none"
      x-data="salesApp()" x-init="initApp()">

    <!-- THANH TIÊU ĐỀ TRÊN CÙNG (CHỈ GIỮ CHỮ INSTOOL) & THỐNG KÊ NHANH -->
    <header class="bg-white border-b border-neutral-200 px-5 py-3 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3.5">
            <span class="font-extrabold tracking-tight text-base font-mono uppercase bg-black text-white px-3 py-1 rounded">INSTOOL</span>
            <div class="hidden sm:flex items-center space-x-1.5 pl-3 border-l border-neutral-200 text-xs font-mono text-neutral-500">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Máy chủ đám mây (Đang kết nối)</span>
            </div>
        </div>

        <!-- Các thẻ đếm số lượng tổng quan -->
        <div class="flex items-center space-x-2.5 text-xs sm:text-sm font-mono">
            <div class="px-3 py-1.5 bg-amber-50 border border-amber-200 rounded text-amber-900 flex items-center space-x-1.5 font-bold shadow-2xs">
                <span>Hôm nay cần làm:</span>
                <span class="text-amber-800 text-sm font-extrabold" x-text="stats.today_due">0</span>
            </div>
            <div class="hidden md:flex px-3 py-1.5 bg-blue-50 border border-blue-200 rounded text-blue-900 items-center space-x-1.5">
                <span>Khách mới:</span>
                <span class="font-bold text-sm" x-text="stats.new">0</span>
            </div>
            <div class="hidden md:flex px-3 py-1.5 bg-neutral-100 border border-neutral-200 rounded text-neutral-800 items-center space-x-1.5">
                <span>Đang chăm sóc:</span>
                <span class="font-bold text-sm" x-text="stats.active">0</span>
            </div>
            <div class="px-3 py-1.5 bg-emerald-50 border border-emerald-300 rounded text-emerald-900 flex items-center space-x-1.5 font-bold shadow-2xs">
                <span>Chốt đơn:</span>
                <span class="text-emerald-800 text-sm font-extrabold" x-text="stats.won">0</span>
            </div>

            <!-- Nút tải lại dữ liệu -->
            <button @click="loadLeads(); loadStats();" :disabled="isLoading"
                    class="p-2 border border-neutral-200 rounded hover:bg-neutral-100 text-neutral-600 transition"
                    title="Tải lại dữ liệu">
                <span :class="{'inline-block animate-spin': isLoading}">↻</span>
            </button>
        </div>
    </header>

    <!-- THÔNG BÁO NỔI (TOAST) -->
    <div x-show="toastShow" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed bottom-5 right-5 z-50 max-w-sm p-4 rounded border shadow-2xl text-xs sm:text-sm flex items-center space-x-2.5 font-sans"
         :class="{
             'bg-neutral-900 text-white border-neutral-800': toastType === 'info',
             'bg-emerald-50 text-emerald-900 border-emerald-300': toastType === 'success',
             'bg-rose-50 text-rose-900 border-rose-300': toastType === 'error'
         }">
        <span class="flex-1 font-medium" x-text="toastMsg"></span>
        <button type="button" @click="toastShow = false" class="opacity-60 hover:opacity-100 text-base font-bold">&times;</button>
    </div>

    <!-- KHÔNG GIAN LÀM VIỆC 2 CỘT -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- ========================================================== -->
        <!-- CỘT TRÁI (38%): BỘ LỌC THÔNG MINH CHO 5.000 KHÁCH & DANH SÁCH -->
        <!-- ========================================================== -->
        <section class="w-full md:w-[40%] lg:w-[38%] bg-white border-r border-neutral-200 flex flex-col shrink-0"
                 :class="{'hidden md:flex': mobileDetailOpen, 'flex': !mobileDetailOpen}">

            <!-- 1. Thanh chuyển Tab nghiệp vụ chính -->
            <div class="p-3.5 border-b border-neutral-200 space-y-3">
                <div class="flex items-center space-x-1.5 overflow-x-auto text-xs sm:text-sm font-mono">
                    <button @click="switchTab('today')"
                            class="px-3 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'today' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Cần làm hôm nay (<span x-text="stats.today_due"></span>)
                    </button>
                    <button @click="switchTab('new')"
                            class="px-3 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'new' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Mới (<span x-text="stats.new"></span>)
                    </button>
                    <button @click="switchTab('active')"
                            class="px-3 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'active' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Đang chăm sóc (<span x-text="stats.active"></span>)
                    </button>
                    <button @click="switchTab('won')"
                            class="px-3 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'won' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Đã chốt (<span x-text="stats.won"></span>)
                    </button>
                    <button @click="switchTab('all')"
                            class="px-3 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'all' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Tất cả (<span x-text="stats.total"></span>)
                    </button>
                </div>

                <!-- 2. Ô tìm kiếm đa năng + Nút Bộ lọc thông minh + Sắp xếp -->
                <div class="flex items-center space-x-2">
                    <div class="relative flex-1">
                        <input type="text" x-model="searchQuery" @input="applyLocalFilters()"
                               placeholder="Tìm tài khoản, họ tên, ngành, ghi chú..."
                               class="w-full text-xs sm:text-sm pl-8 pr-8 py-2 border border-neutral-300 rounded focus:outline-none focus:border-black font-sans">
                        <span class="absolute left-2.5 top-2 text-neutral-400 text-sm font-mono">⚲</span>
                        <button x-show="searchQuery" @click="searchQuery = ''; applyLocalFilters();"
                                class="absolute right-2.5 top-2 text-neutral-400 hover:text-black text-sm font-bold font-mono">✕</button>
                    </div>

                    <!-- Nút mở/đóng Khung Bộ lọc nâng cao -->
                    <button @click="showAdvancedFilter = !showAdvancedFilter"
                            class="px-3 py-2 border rounded text-xs sm:text-sm font-mono transition flex items-center space-x-1.5 shrink-0"
                            :class="showAdvancedFilter || activeFilterCount > 0 ? 'bg-black text-white border-black font-bold' : 'bg-white border-neutral-300 text-neutral-700 hover:bg-neutral-50'">
                        <span>Lọc</span>
                        <span x-show="activeFilterCount > 0" class="px-1.5 py-0.2 bg-white text-black rounded text-[11px] font-bold" x-text="activeFilterCount"></span>
                        <span x-text="showAdvancedFilter ? '▲' : '▼'" class="text-[10px]"></span>
                    </button>

                    <!-- Sắp xếp nhanh -->
                    <select x-model="sortBy" @change="applyLocalFilters()"
                            class="text-xs sm:text-sm font-mono border border-neutral-300 rounded px-2.5 py-2 bg-white text-neutral-700 focus:outline-none max-w-[140px]">
                        <option value="default">Ưu tiên hôm nay</option>
                        <option value="created_desc">Mới tải lên nhất</option>
                        <option value="score_desc">Điểm AI cao nhất</option>
                        <option value="followers_desc">Nhiều flw nhất</option>
                        <option value="reels_desc">Nhiều Reels nhất</option>
                        <option value="updated_desc">Mới cập nhật</option>
                    </select>
                </div>

                <!-- 3. KHUNG BỘ LỌC ĐA TẦNG CHO BÀI TOÁN 5.000 KHÁCH (MỞ RỘNG / THU GỌN) -->
                <div x-show="showAdvancedFilter" x-cloak
                     x-transition:enter="transition ease-out duration-150"
                     x-transition:enter-start="opacity-0 -translate-y-2"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="p-3.5 bg-neutral-50 border border-neutral-200 rounded space-y-3 text-xs sm:text-sm font-mono shadow-inner">
                    
                    <div class="grid grid-cols-2 gap-2.5">
                        <!-- Tiêu chí 1: ĐỢT TẢI LÊN (BATCH) - GIẢI QUYẾT BÀI TOÁN TẬP KHÁCH MỚI -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                📅 Đợt tải lên (Mẻ khách)
                            </label>
                            <select x-model="batchFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Tất cả các đợt</option>
                                <option value="today">🔥 Đợt mới hôm nay</option>
                                <option value="last_3d">3 ngày qua</option>
                                <option value="last_7d">7 ngày qua</option>
                                <option value="last_30d">30 ngày qua</option>
                                <option value="older">Các đợt cũ hơn</option>
                            </select>
                        </div>

                        <!-- Tiêu chí 2: TÌNH TRẠNG PHÂN BỔ (AI ĐANG PHỤ TRÁCH) -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                👤 Người phụ trách
                            </label>
                            <select x-model="assignmentFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Tất cả khách hàng</option>
                                <option value="unassigned">Chưa ai nhận (Mới tinh)</option>
                                <option value="assigned">Đã có người phụ trách</option>
                            </select>
                        </div>

                        <!-- Tiêu chí 3: Mức điểm đánh giá AI -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                ⭐ Mức điểm AI
                            </label>
                            <select x-model="scoreFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Mọi mức điểm</option>
                                <option value="vip">≥ 80 điểm (Khách VIP)</option>
                                <option value="qualified">65 – 79 điểm (Đạt chuẩn)</option>
                                <option value="medium">50 – 64 điểm (Trung bình)</option>
                                <option value="low">&lt; 50 điểm (Thấp)</option>
                            </select>
                        </div>

                        <!-- Tiêu chí 4: Quy mô người theo dõi (Followers) -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                👥 Người theo dõi
                            </label>
                            <select x-model="followersFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Mọi quy mô</option>
                                <option value="micro">&lt; 5.000 flw (Micro)</option>
                                <option value="growth">5.000 – 25.000 flw (Tăng trưởng)</option>
                                <option value="medium">25.000 – 100.000 flw (Ngân sách tốt)</option>
                                <option value="high">&gt; 100.000 flw (Kênh lớn)</option>
                                <option value="custom">Tùy chọn số lượng...</option>
                            </select>
                        </div>

                        <!-- Tiêu chí 5: Số lượng Reels 30 ngày -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                🎬 Reels / 30 ngày
                            </label>
                            <select x-model="reelsFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Mọi tần suất</option>
                                <option value="high">≥ 12 reels (Rất tích cực)</option>
                                <option value="medium">6 – 11 reels (Đều đặn)</option>
                                <option value="low">&lt; 6 reels (Quá tải tự dựng)</option>
                            </select>
                        </div>

                        <!-- Tiêu chí 6: Lĩnh vực / Ngành nghề -->
                        <div>
                            <label class="block text-xs uppercase font-bold text-neutral-700 mb-1">
                                🏷️ Ngành nghề / Niche
                            </label>
                            <select x-model="industryFilter" @change="applyLocalFilters()" class="w-full text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white">
                                <option value="all">Tất cả ngành nghề</option>
                                <template x-for="ind in availableIndustries" :key="ind">
                                    <option :value="ind" x-text="ind"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <!-- Ô nhập Followers tùy chọn khi chọn 'custom' -->
                    <div x-show="followersFilter === 'custom'" class="flex items-center space-x-2 pt-1">
                        <input type="number" x-model.number="customMinFollowers" @input="applyLocalFilters()" placeholder="Flw tối thiểu (Min)" class="flex-1 text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white font-mono">
                        <span class="text-neutral-400">-</span>
                        <input type="number" x-model.number="customMaxFollowers" @input="applyLocalFilters()" placeholder="Flw tối đa (Max)" class="flex-1 text-xs sm:text-sm p-1.5 border border-neutral-300 rounded bg-white font-mono">
                    </div>

                    <!-- Nút xóa bộ lọc -->
                    <div class="flex items-center justify-between pt-2 border-t border-neutral-200 text-xs sm:text-sm">
                        <span class="text-neutral-500 font-sans">
                            Tìm thấy: <b class="text-black font-mono text-sm" x-text="filteredLeads.length"></b> / <span x-text="leads.length"></span> khách
                        </span>
                        <button type="button" @click="resetFilters()" class="text-rose-600 hover:text-rose-800 font-bold transition">
                            Xóa toàn bộ bộ lọc ✕
                        </button>
                    </div>
                </div>

                <!-- 4. Thanh đếm kết quả nhỏ -->
                <div class="flex items-center justify-between text-xs font-mono text-neutral-500 pt-0.5">
                    <div>
                        Hiển thị: <b class="text-neutral-900 text-sm" x-text="filteredLeads.length"></b> khách
                        <span x-show="activeFilterCount > 0" class="text-neutral-400 font-sans">(Đang áp dụng <span x-text="activeFilterCount"></span> tiêu chí lọc)</span>
                    </div>
                    <button x-show="activeFilterCount > 0" @click="resetFilters()" class="text-xs text-neutral-500 hover:text-black font-sans font-bold">
                        Xóa lọc ✕
                    </button>
                </div>
            </div>

            <!-- 5. Danh sách thẻ khách hàng cuộn dọc -->
            <div class="flex-1 overflow-y-auto divide-y divide-neutral-100 select-text">
                <template x-if="isLoading && leads.length === 0">
                    <div class="p-8 text-center text-neutral-400 text-sm">
                        <span class="inline-block animate-spin mr-1.5">↻</span> Đang tải danh sách khách hàng từ máy chủ...
                    </div>
                </template>

                <template x-if="!isLoading && filteredLeads.length === 0">
                    <div class="p-8 text-center text-neutral-400 text-sm space-y-1">
                        <p class="font-bold text-neutral-700">Không có khách hàng nào phù hợp</p>
                        <p class="text-xs text-neutral-500">Hãy kiểm tra lại bộ lọc hoặc đẩy thêm mẻ khách mới từ phần mềm Instool.</p>
                    </div>
                </template>

                <template x-for="lead in filteredLeads" :key="lead.id || lead.username">
                    <div @click="selectLead(lead)"
                         class="p-4 hover:bg-neutral-50 transition cursor-pointer flex items-start space-x-3.5"
                         :class="selectedLead && selectedLead.username === lead.username ? 'bg-neutral-50 border-l-4 border-black' : ''">
                        
                        <!-- Avatar chữ cái -->
                        <div class="w-9 h-9 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-sm shrink-0 uppercase font-mono shadow-2xs">
                            <span x-text="lead.username.charAt(0)"></span>
                        </div>

                        <!-- Thông tin tóm tắt -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-mono font-bold text-sm text-neutral-900 truncate">@<span x-text="lead.username"></span></span>
                                
                                <!-- Điểm đánh giá AI -->
                                <span class="font-mono text-xs font-bold px-2 py-0.5 rounded border shrink-0"
                                      :class="{
                                          'bg-emerald-50 text-emerald-800 border-emerald-300': (lead.fit_score || 0) >= 80,
                                          'bg-blue-50 text-blue-800 border-blue-200': (lead.fit_score || 0) >= 65 && (lead.fit_score || 0) < 80,
                                          'bg-neutral-100 text-neutral-600 border-neutral-200': (lead.fit_score || 0) < 65
                                      }">
                                    Điểm: <span x-text="lead.fit_score || '-'"></span>
                                </span>
                            </div>

                            <div class="text-xs text-neutral-600 truncate mb-1.5 font-medium">
                                <span x-text="lead.full_name || lead.detected_industry || 'Chưa cập nhật họ tên'"></span>
                            </div>

                            <!-- Meta info: Followers + Status -->
                            <div class="flex items-center justify-between text-xs font-mono text-neutral-400">
                                <span><span x-text="formatNumber(lead.followers)"></span> người theo dõi</span>
                                
                                <span class="px-2 py-0.5 rounded border text-[11px] font-bold"
                                      :class="{
                                          'bg-neutral-100 text-neutral-700 border-neutral-300': lead.sale_status === 'New',
                                          'bg-blue-50 text-blue-800 border-blue-300': lead.sale_status === 'Contacted',
                                          'bg-amber-50 text-amber-800 border-amber-300': ['In_Discussion', 'Demo_Sent'].includes(lead.sale_status),
                                          'bg-emerald-50 text-emerald-800 border-emerald-300': lead.sale_status === 'Won',
                                          'bg-rose-50 text-rose-800 border-rose-300': lead.sale_status === 'Lost'
                                      }"
                                      x-text="getSaleStatusLabel(lead.sale_status)">
                                </span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>


        <!-- ============================================================= -->
        <!-- CỘT PHẢI (62%): CHI TIẾT KHÁCH HÀNG & BÀN LÀM VIỆC TIẾP CẬN -->
        <!-- ============================================================= -->
        <section class="flex-1 bg-neutral-50 flex flex-col overflow-y-auto select-text"
                 :class="{'flex': mobileDetailOpen, 'hidden md:flex': !mobileDetailOpen}">

            <template x-if="!selectedLead">
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center text-neutral-400 text-sm">
                    <div class="w-14 h-14 rounded-full border border-neutral-300 flex items-center justify-center text-2xl mb-3 text-neutral-500">
                        ☞
                    </div>
                    <p class="font-bold text-neutral-800 text-base uppercase tracking-wide">Chọn một khách hàng để bắt đầu</p>
                    <p class="text-xs text-neutral-500 max-w-sm mt-1.5 leading-relaxed">
                        Xem chi tiết đánh giá AI, điểm đau trong video, kịch bản tin nhắn cá nhân hóa và nút 1 chạm mở Instagram chat.
                    </p>
                </div>
            </template>

            <template x-if="selectedLead">
                <div class="p-5 md:p-7 space-y-5 max-w-4xl mx-auto w-full">

                    <!-- Nút quay lại trên Mobile -->
                    <div class="md:hidden pb-2.5 border-b border-neutral-200">
                        <button @click="mobileDetailOpen = false" class="text-xs font-mono font-bold text-neutral-700 flex items-center space-x-1">
                            <span>&larr;</span> <span>Quay lại danh sách khách hàng</span>
                        </button>
                    </div>

                    <!-- 1. HỒ SƠ TỔNG QUAN KHÁCH HÀNG -->
                    <div class="bg-white border border-neutral-200 rounded-lg p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="space-y-1.5">
                            <div class="flex items-center space-x-2.5">
                                <h2 class="text-lg font-bold font-mono text-neutral-900">@<span x-text="selectedLead.username"></span></h2>
                                <a :href="'https://instagram.com/' + selectedLead.username" target="_blank"
                                   class="px-2.5 py-1 border border-neutral-300 hover:border-black rounded text-xs font-mono text-neutral-700 hover:text-black transition inline-flex items-center space-x-1 shadow-2xs">
                                    <span>Xem trang cá nhân</span>
                                    <span>↗</span>
                                </a>
                            </div>
                            <div class="text-sm text-neutral-800 font-semibold" x-text="selectedLead.full_name || 'Chưa cập nhật họ tên'"></div>
                            <div class="text-xs text-neutral-600 leading-relaxed max-w-xl" x-text="selectedLead.bio || 'Không có tiểu sử'"></div>
                        </div>

                        <!-- Các chỉ số chính -->
                        <div class="flex sm:flex-col items-end gap-1.5 text-xs sm:text-sm font-mono shrink-0">
                            <div class="text-neutral-800">
                                <b><span x-text="formatNumber(selectedLead.followers)"></span></b> Người theo dõi
                            </div>
                            <div class="text-neutral-600 text-xs">
                                <b><span x-text="selectedLead.reels_last_30d || 0"></span></b> Reels trong 30 ngày
                            </div>
                            <div class="text-[11px] text-neutral-400 font-sans" x-text="selectedLead.detected_industry || selectedLead.category_name || 'Chưa phân loại ngành'"></div>
                        </div>
                    </div>


                    <!-- 2. ĐÁNH GIÁ NHU CẦU TỪ AI (GỒM 4 THANH TIÊU CHÍ & ĐIỂM LƯU Ý BẮT CHUYỆN) -->

    <!-- XỬ LÝ DỮ LIỆU BẰNG ALPINE.JS -->
    <script>
        function salesApp() {
            return {
                currentTab: 'today',
                searchQuery: '',
                showAdvancedFilter: false,
                batchFilter: 'all',
                assignmentFilter: 'all',
                scoreFilter: 'all',
                followersFilter: 'all',
                customMinFollowers: '',
                customMaxFollowers: '',
                reelsFilter: 'all',
                industryFilter: 'all',
                sortBy: 'default',
                availableIndustries: [],
                leads: [],
                filteredLeads: [],
                selectedLead: null,
                stats: { today_due: 0, new: 0, active: 0, won: 0, total: 0 },
                isLoading: false,
                isSaving: false,
                mobileDetailOpen: false,
                toastShow: false,
                toastMsg: '',
                toastType: 'info',

                get activeFilterCount() {
                    let count = 0;
                    if (this.searchQuery.trim()) count++;
                    if (this.batchFilter !== 'all') count++;
                    if (this.assignmentFilter !== 'all') count++;
                    if (this.scoreFilter !== 'all') count++;
                    if (this.followersFilter !== 'all') count++;
                    if (this.reelsFilter !== 'all') count++;
                    if (this.industryFilter !== 'all') count++;
                    if (this.sortBy !== 'default') count++;
                    return count;
                },

                resetFilters() {
                    this.searchQuery = '';
                    this.batchFilter = 'all';
                    this.assignmentFilter = 'all';
                    this.scoreFilter = 'all';
                    this.followersFilter = 'all';
                    this.customMinFollowers = '';
                    this.customMaxFollowers = '';
                    this.reelsFilter = 'all';
                    this.industryFilter = 'all';
                    this.sortBy = 'default';
                    this.applyLocalFilters();
                },

                showToast(msg, type = 'info', duration = 4000) {
                    this.toastMsg = msg;
                    this.toastType = type;
                    this.toastShow = true;
                    setTimeout(() => { this.toastShow = false; }, duration);
                },

                formatNumber(num) {
                    if (!num) return '0';
                    return Number(num).toLocaleString('vi-VN');
                },

                getSaleStatusLabel(st) {
                    const map = {
                        'New': 'Mới',
                        'Contacted': 'Đã gửi tin',
                        'In_Discussion': 'Đang trao đổi',
                        'Demo_Sent': 'Đã gửi video mẫu',
                        'Won': 'Chốt đơn ★',
                        'Lost': 'Từ chối'
                    };
                    return map[st] || st || 'Mới';
                },

                getEvidenceTitle(point) {
                    if (!point) return 'Gợi ý bắt chuyện';
                    const c = point.criterion || '';
                    if (c === 'retention_need') return 'Nhu cầu tối ưu giữ chân & Hook';
                    if (c === 'monetization_budget') return 'Khả năng chi trả & Phễu bán hàng';
                    if (c === 'video_volume') return 'Tần suất đăng tải video';
                    if (c === 'capacity_bottleneck') return 'Dấu hiệu quá tải tự dựng';
                    if (c === 'intent_hiring') return 'Tín hiệu cần tìm Editor';
                    return 'Điểm đáng chú ý';
                },

                getEvidenceText(point) {
                    if (!point) return '';
                    if (typeof point === 'string') return point;
                    return point.reasoning || point.detail || point.point || '';
                },

                async initApp() {
                    await Promise.all([this.loadStats(), this.loadLeads()]);
                },

                switchTab(tab) {
                    this.currentTab = tab;
                    this.loadLeads();
                },

                async loadStats() {
                    try {
                        const res = await fetch('/api/stats');
                        const data = await res.json();
                        if (data.success && data.stats) {
                            this.stats = data.stats;
                        }
                    } catch (e) {
                        console.warn('Could not load stats:', e);
                    }
                },

                async loadLeads() {
                    this.isLoading = true;
                    try {
                        const params = new URLSearchParams();
                        params.set('tab', this.currentTab);
                        if (this.batchFilter !== 'all') params.set('batch', this.batchFilter);
                        if (this.assignmentFilter !== 'all') params.set('assigned_to', this.assignmentFilter);

                        const res = await fetch('/api/leads?' + params.toString());
                        const data = await res.json();
                        if (data.success) {
                            this.leads = data.leads || [];
                            
                            // Thu thập danh sách ngành nghề thực tế có trong dữ liệu
                            const indSet = new Set();
                            this.leads.forEach(l => {
                                const ind = (l.detected_industry || l.category_name || '').trim();
                                if (ind) indSet.add(ind);
                            });
                            this.availableIndustries = Array.from(indSet).sort();

                            this.applyLocalFilters();
                            
                            // Tự động chọn khách hàng đầu tiên nếu chưa chọn
                            if (!this.selectedLead && this.filteredLeads.length > 0) {
                                this.selectedLead = this.filteredLeads[0];
                            } else if (this.selectedLead) {
                                const found = this.filteredLeads.find(l => l.username === this.selectedLead.username);
                                if (found) this.selectedLead = found;
                            }
                        } else {
                            this.showToast(data.error || 'Lỗi tải dữ liệu từ máy chủ', 'error');
                        }
                    } catch (e) {
                        this.showToast('Lỗi kết nối khi tải khách hàng: ' + e, 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                applyLocalFilters() {
                    let list = [...this.leads];

                    // 1. Tìm kiếm từ khóa đa năng
                    const q = this.searchQuery.trim().toLowerCase();
                    if (q) {
                        list = list.filter(l => {
                            const u = (l.username || '').toLowerCase();
                            const fn = (l.full_name || '').toLowerCase();
                            const bio = (l.bio || '').toLowerCase();
                            const ind = (l.detected_industry || l.category_name || '').toLowerCase();
                            const note = (l.sale_note || '').toLowerCase();
                            return u.includes(q) || fn.includes(q) || bio.includes(q) || ind.includes(q) || note.includes(q);
                        });
                    }

                    // 2. Lọc theo Đợt tải lên (Batch)
                    if (this.batchFilter !== 'all') {
                        const now = new Date();
                        const todayStr = now.toISOString().slice(0, 10);
                        list = list.filter(l => {
                            if (!l.created_at) return true;
                            const createdDate = l.created_at.slice(0, 10);
                            if (this.batchFilter === 'today') return createdDate === todayStr;
                            
                            const diffDays = Math.floor((now - new Date(l.created_at)) / (1000 * 60 * 60 * 24));
                            if (this.batchFilter === 'last_3d') return diffDays <= 3;
                            if (this.batchFilter === 'last_7d') return diffDays <= 7;
                            if (this.batchFilter === 'last_30d') return diffDays <= 30;
                            if (this.batchFilter === 'older') return diffDays > 30;
                            return true;
                        });
                    }

                    // 3. Lọc theo Tình trạng phân bổ
                    if (this.assignmentFilter === 'unassigned') {
                        list = list.filter(l => !l.sale_assigned_to || !l.sale_assigned_to.trim());
                    } else if (this.assignmentFilter === 'assigned') {
                        list = list.filter(l => l.sale_assigned_to && l.sale_assigned_to.trim());
                    }

                    // 4. Mức điểm đánh giá AI
                    if (this.scoreFilter === 'vip' || this.scoreFilter === '80') {
                        list = list.filter(l => (l.fit_score || 0) >= 80);
                    } else if (this.scoreFilter === 'qualified' || this.scoreFilter === '65') {
                        list = list.filter(l => (l.fit_score || 0) >= 65 && (l.fit_score || 0) < 80);
                    } else if (this.scoreFilter === 'medium') {
                        list = list.filter(l => (l.fit_score || 0) >= 50 && (l.fit_score || 0) < 65);
                    } else if (this.scoreFilter === 'low') {
                        list = list.filter(l => (l.fit_score || 0) < 50);
                    }

                    // 5. Quy mô Followers
                    if (this.followersFilter === 'micro') {
                        list = list.filter(l => (l.followers || 0) < 5000);
                    } else if (this.followersFilter === 'growth') {
                        list = list.filter(l => (l.followers || 0) >= 5000 && (l.followers || 0) <= 25000);
                    } else if (this.followersFilter === 'medium') {
                        list = list.filter(l => (l.followers || 0) > 25000 && (l.followers || 0) <= 100000);
                    } else if (this.followersFilter === 'high') {
                        list = list.filter(l => (l.followers || 0) > 100000);
                    } else if (this.followersFilter === 'custom') {
                        if (this.customMinFollowers !== '') {
                            list = list.filter(l => (l.followers || 0) >= Number(this.customMinFollowers));
                        }
                        if (this.customMaxFollowers !== '') {
                            list = list.filter(l => (l.followers || 0) <= Number(this.customMaxFollowers));
                        }
                    }

                    // 6. Số Reels trong 30 ngày
                    if (this.reelsFilter === 'high') {
                        list = list.filter(l => (l.reels_last_30d || 0) >= 12);
                    } else if (this.reelsFilter === 'medium') {
                        list = list.filter(l => (l.reels_last_30d || 0) >= 6 && (l.reels_last_30d || 0) < 12);
                    } else if (this.reelsFilter === 'low') {
                        list = list.filter(l => (l.reels_last_30d || 0) < 6);
                    }

                    // 7. Ngành nghề / Lĩnh vực
                    if (this.industryFilter !== 'all') {
                        list = list.filter(l => {
                            const ind = (l.detected_industry || l.category_name || '').trim();
                            return ind === this.industryFilter;
                        });
                    }

                    // 8. Sắp xếp kết quả
                    if (this.sortBy === 'score_desc') {
                        list.sort((a, b) => (b.fit_score || 0) - (a.fit_score || 0));
                    } else if (this.sortBy === 'followers_desc') {
                        list.sort((a, b) => (b.followers || 0) - (a.followers || 0));
                    } else if (this.sortBy === 'reels_desc') {
                        list.sort((a, b) => (b.reels_last_30d || 0) - (a.reels_last_30d || 0));
                    } else if (this.sortBy === 'created_desc') {
                        list.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
                    } else if (this.sortBy === 'updated_desc') {
                        list.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
                    } else {
                        // Mặc định: Ưu tiên khách cần làm hôm nay, sau đó đến điểm cao
                        const now = new Date().toISOString().slice(0, 10);
                        list.sort((a, b) => {
                            const aDue = a.follow_up_at && a.follow_up_at.slice(0, 10) <= now ? 0 : 1;
                            const bDue = b.follow_up_at && b.follow_up_at.slice(0, 10) <= now ? 0 : 1;
                            if (aDue !== bDue) return aDue - bDue;
                            return (b.fit_score || 0) - (a.fit_score || 0);
                        });
                    }

                    this.filteredLeads = list;

                    // Giữ nguyên khách đang chọn hoặc chọn khách đầu tiên của danh sách đã lọc
                    if (this.filteredLeads.length > 0) {
                        if (!this.selectedLead || !this.filteredLeads.some(l => l.username === this.selectedLead.username)) {
                            this.selectedLead = this.filteredLeads[0];
                        }
                    } else {
                        this.selectedLead = null;
                    }
                },

                selectLead(lead) {
                    this.selectedLead = lead;
                    this.mobileDetailOpen = true;
                },

                async copyDmAndOpenChat(lead) {
                    if (!lead) return;
                    const dmText = lead.suggested_dm || '';
                    
                    // 1. Sao chép tin nhắn vào bộ nhớ tạm
                    try {
                        await navigator.clipboard.writeText(dmText);
                    } catch (err) {
                        const ta = document.createElement('textarea');
                        ta.value = dmText;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }

                    // 2. Mở hộp thư Instagram trong tab mới
                    const igUrl = `https://ig.me/m/${lead.username}`;
                    window.open(igUrl, '_blank');

                    // 3. Tự động đổi trạng thái sang "Đã gửi tin" và lên lịch nhắc sau 3 ngày
                    lead.sale_status = 'Contacted';
                    lead.contacted_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
                    
                    const next3Days = new Date();
                    next3Days.setDate(next3Days.getDate() + 3);
                    lead.follow_up_at = next3Days.toISOString().slice(0, 16);

                    // 4. Lưu lên máy chủ D1
                    await this.saveLeadProgress(lead, false);

                    this.showToast(`Đã sao chép tin nhắn & mở hộp thư @${lead.username}!`, 'success', 5000);
                },

                async copyOnlyDm(text) {
                    if (!text) return;
                    try {
                        await navigator.clipboard.writeText(text);
                        this.showToast('Đã sao chép tin nhắn vào bộ nhớ tạm!', 'success');
                    } catch (e) {
                        this.showToast('Lỗi sao chép: ' + e, 'error');
                    }
                },

                async saveLeadProgress(lead, showFeedback = true) {
                    if (!lead) return;
                    this.isSaving = true;
                    try {
                        const payload = {
                            id: lead.id,
                            username: lead.username,
                            sale_status: lead.sale_status,
                            sale_tag: lead.sale_tag,
                            sale_note: lead.sale_note,
                            sale_assigned_to: lead.sale_assigned_to,
                            follow_up_at: lead.follow_up_at,
                            contacted_at: lead.contacted_at
                        };

                        const res = await fetch('/api/leads', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (data.success) {
                            if (showFeedback) {
                                this.showToast('Đã lưu tiến độ chăm sóc khách hàng thành công!', 'success');
                            }
                            this.loadStats();
                        } else {
                            this.showToast(data.error || 'Lỗi lưu tiến độ', 'error');
                        }
                    } catch (e) {
                        this.showToast('Lỗi lưu: ' + e, 'error');
                    } finally {
                        this.isSaving = false;
                    }
                }
            };
        }
    </script>
</body>
