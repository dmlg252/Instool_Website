<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instool — Cổng Quản Lý & Tiếp Cận Khách Hàng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f5f5f5; }
        ::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #a3a3a3; }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-900 font-sans antialiased h-screen flex flex-col overflow-hidden select-none"
      x-data="salesApp()" x-init="initApp()">

    <!-- THANH TIÊU ĐỀ TRÊN CÙNG & THỐNG KÊ NHANH -->
    <header class="bg-white border-b border-neutral-200 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-2">
                <span class="font-extrabold tracking-tight text-sm font-mono uppercase bg-black text-white px-2 py-0.5 rounded">INSTOOL</span>
                <span class="text-xs font-bold text-neutral-800 tracking-wide uppercase">Cổng Tiếp Cận Khách Hàng</span>
            </div>
            <div class="hidden sm:flex items-center space-x-1.5 pl-3 border-l border-neutral-200 text-[11px] font-mono text-neutral-500">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Máy chủ đám mây (Đang kết nối)</span>
            </div>
        </div>

        <!-- Các thẻ đếm số lượng -->
        <div class="flex items-center space-x-2 text-xs font-mono">
            <div class="px-2.5 py-1 bg-amber-50 border border-amber-200 rounded text-amber-900 flex items-center space-x-1 font-bold">
                <span>Hôm nay cần làm:</span>
                <span class="text-amber-800" x-text="stats.today_due">0</span>
            </div>
            <div class="hidden md:flex px-2.5 py-1 bg-blue-50 border border-blue-200 rounded text-blue-900 items-center space-x-1">
                <span>Khách mới:</span>
                <span class="font-bold" x-text="stats.new">0</span>
            </div>
            <div class="hidden md:flex px-2.5 py-1 bg-neutral-100 border border-neutral-200 rounded text-neutral-800 items-center space-x-1">
                <span>Đang chăm sóc:</span>
                <span class="font-bold" x-text="stats.active">0</span>
            </div>
            <div class="px-2.5 py-1 bg-emerald-50 border border-emerald-300 rounded text-emerald-900 flex items-center space-x-1 font-bold">
                <span>Chốt đơn:</span>
                <span class="text-emerald-800" x-text="stats.won">0</span>
            </div>

            <!-- Nút tải lại -->
            <button @click="loadLeads(); loadStats();" :disabled="isLoading"
                    class="p-1.5 border border-neutral-200 rounded hover:bg-neutral-100 text-neutral-600 transition"
                    title="Tải lại dữ liệu">
                <span :class="{'inline-block animate-spin': isLoading}">↻</span>
            </button>
        </div>
    </header>

    <!-- THÔNG BÁO NỔI (TOAST) -->
    <div x-show="toastShow" x-cloak
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         class="fixed bottom-5 right-5 z-50 max-w-sm p-3.5 rounded border shadow-2xl text-xs flex items-center space-x-2.5 font-sans"
         :class="{
             'bg-neutral-900 text-white border-neutral-800': toastType === 'info',
             'bg-emerald-50 text-emerald-900 border-emerald-300': toastType === 'success',
             'bg-rose-50 text-rose-900 border-rose-300': toastType === 'error'
         }">
        <span class="flex-1 font-medium" x-text="toastMsg"></span>
        <button type="button" @click="toastShow = false" class="opacity-60 hover:opacity-100 text-sm font-bold">&times;</button>
    </div>

    <!-- KHÔNG GIAN LÀM VIỆC 2 CỘT -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- ==================================================== -->
        <!-- CỘT TRÁI (35-40%): DANH SÁCH KHÁCH HÀNG & BỘ LỌC    -->
        <!-- ==================================================== -->
        <section class="w-full md:w-[40%] lg:w-[35%] bg-white border-r border-neutral-200 flex flex-col shrink-0"
                 :class="{'hidden md:flex': mobileDetailOpen, 'flex': !mobileDetailOpen}">

            <!-- Thanh chuyển tab -->
            <div class="p-3 border-b border-neutral-200 space-y-2.5">
                <div class="flex items-center space-x-1 overflow-x-auto text-xs font-mono">
                    <button @click="switchTab('today')"
                            class="px-2.5 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'today' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Cần làm hôm nay (<span x-text="stats.today_due"></span>)
                    </button>
                    <button @click="switchTab('new')"
                            class="px-2.5 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'new' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Mới (<span x-text="stats.new"></span>)
                    </button>
                    <button @click="switchTab('active')"
                            class="px-2.5 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'active' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Đang chăm sóc (<span x-text="stats.active"></span>)
                    </button>
                    <button @click="switchTab('won')"
                            class="px-2.5 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'won' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Đã chốt (<span x-text="stats.won"></span>)
                    </button>
                    <button @click="switchTab('all')"
                            class="px-2.5 py-1.5 rounded transition whitespace-nowrap"
                            :class="currentTab === 'all' ? 'bg-black text-white font-bold' : 'text-neutral-600 hover:bg-neutral-100'">
                        Tất cả (<span x-text="stats.total"></span>)
                    </button>
                </div>

                <!-- Ô tìm kiếm & Lọc theo điểm AI -->
                <div class="flex items-center space-x-2">
                    <div class="relative flex-1">
                        <input type="text" x-model.debounce.300ms="searchQuery" @input="loadLeads()"
                               placeholder="Tìm tên tài khoản, họ tên, ghi chú..."
                               class="w-full text-xs pl-7 pr-3 py-1.5 border border-neutral-300 rounded focus:outline-none focus:border-black font-sans">
                        <span class="absolute left-2.5 top-1.5 text-neutral-400 text-xs font-mono">⚲</span>
                    </div>

                    <select x-model="scoreFilter" @change="applyLocalFilters()"
                            class="text-[11px] font-mono border border-neutral-300 rounded px-2 py-1.5 bg-white text-neutral-700 focus:outline-none">
                        <option value="all">Mọi điểm đánh giá</option>
                        <option value="80">≥ 80 (Rất tiềm năng)</option>
                        <option value="65">≥ 65 (Tiềm năng)</option>
                    </select>
                </div>
            </div>

            <!-- Danh sách thẻ khách hàng cuộn dọc -->
            <div class="flex-1 overflow-y-auto divide-y divide-neutral-100 select-text">
                <template x-if="isLoading && leads.length === 0">
                    <div class="p-8 text-center text-neutral-400 text-xs">
                        <span class="inline-block animate-spin mr-1.5">↻</span> Đang tải danh sách khách hàng từ máy chủ...
                    </div>
                </template>

                <template x-if="!isLoading && filteredLeads.length === 0">
                    <div class="p-8 text-center text-neutral-400 text-xs space-y-1">
                        <p class="font-bold text-neutral-600">Không có khách hàng nào phù hợp</p>
                        <p class="text-[11px]">Hãy kiểm tra lại bộ lọc hoặc đẩy thêm khách từ phần mềm Instool.</p>
                    </div>
                </template>

                <template x-for="lead in filteredLeads" :key="lead.id || lead.username">
                    <div @click="selectLead(lead)"
                         class="p-3.5 hover:bg-neutral-50 transition cursor-pointer flex items-start space-x-3"
                         :class="selectedLead && selectedLead.username === lead.username ? 'bg-neutral-50 border-l-4 border-black' : ''">
                        
                        <!-- Avatar chữ cái đại diện -->
                        <div class="w-8 h-8 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-xs shrink-0 uppercase font-mono">
                            <span x-text="lead.username.charAt(0)"></span>
                        </div>

                        <!-- Thông tin tóm tắt -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-0.5">
                                <span class="font-mono font-bold text-xs text-neutral-900 truncate">@<span x-text="lead.username"></span></span>
                                
                                <!-- Điểm đánh giá AI -->
                                <span class="font-mono text-[10px] font-bold px-1.5 py-0.2 rounded border shrink-0"
                                      :class="{
                                          'bg-emerald-50 text-emerald-800 border-emerald-300': (lead.fit_score || 0) >= 80,
                                          'bg-blue-50 text-blue-800 border-blue-200': (lead.fit_score || 0) >= 65 && (lead.fit_score || 0) < 80,
                                          'bg-neutral-100 text-neutral-600 border-neutral-200': (lead.fit_score || 0) < 65
                                      }">
                                    Điểm: <span x-text="lead.fit_score || '-'"></span>
                                </span>
                            </div>

                            <div class="text-[11px] text-neutral-600 truncate mb-1">
                                <span x-text="lead.full_name || lead.detected_industry || 'Chưa cập nhật họ tên'"></span>
                            </div>

                            <!-- Chỉ số người theo dõi & Trạng thái -->
                            <div class="flex items-center justify-between text-[10px] font-mono text-neutral-400">
                                <span><span x-text="formatNumber(lead.followers)"></span> người theo dõi</span>
                                
                                <span class="px-1.5 py-0.5 rounded border text-[9px] font-bold"
                                      :class="{
                                          'bg-neutral-100 text-neutral-700 border-neutral-300': lead.sale_status === 'New',
                                          'bg-blue-50 text-blue-800 border-blue-300': lead.sale_status === 'Contacted',
                                          'bg-amber-50 text-amber-800 border-amber-300': ['In_Discussion', 'Demo_Sent'].includes(lead.sale_status),
                                          'bg-emerald-50 text-emerald-800 border-emerald-300': lead.sale_status === 'Won',
                                          'bg-rose-50 text-rose-800 border-rose-300': lead.sale_status === 'Lost'
                                      }"
                                      x-text="getSaleStatusLabel(lead.sale_status)">
                                </span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>


        <!-- ============================================================= -->
        <!-- CỘT PHẢI (60-65%): CHI TIẾT KHÁCH HÀNG & BÀN LÀM VIỆC TIẾP CẬN -->
        <!-- ============================================================= -->
        <section class="flex-1 bg-neutral-50 flex flex-col overflow-y-auto select-text"
                 :class="{'flex': mobileDetailOpen, 'hidden md:flex': !mobileDetailOpen}">

            <template x-if="!selectedLead">
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center text-neutral-400 text-xs">
                    <div class="w-12 h-12 rounded-full border border-neutral-300 flex items-center justify-center text-lg mb-2 text-neutral-500">
                        ☞
                    </div>
                    <p class="font-bold text-neutral-700 uppercase tracking-wide">Chọn một khách hàng để bắt đầu</p>
                    <p class="text-[11px] text-neutral-500 max-w-sm mt-1">
                        Xem chi tiết đánh giá AI, điểm đau trong video, kịch bản tin nhắn cá nhân hóa và nút 1 chạm mở Instagram chat.
                    </p>
                </div>
            </template>

            <template x-if="selectedLead">
                <div class="p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full">

                    <!-- Nút quay lại dành riêng cho màn hình điện thoại -->
                    <div class="md:hidden pb-2 border-b border-neutral-200">
                        <button @click="mobileDetailOpen = false" class="text-xs font-mono font-bold text-neutral-700 flex items-center space-x-1">
                            <span>&larr;</span> <span>Quay lại danh sách khách hàng</span>
                        </button>
                    </div>

                    <!-- 1. HỒ SƠ TỔNG QUAN KHÁCH HÀNG -->
                    <div class="bg-white border border-neutral-200 rounded p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <h2 class="text-base font-bold font-mono text-neutral-900">@<span x-text="selectedLead.username"></span></h2>
                                <a :href="'https://instagram.com/' + selectedLead.username" target="_blank"
                                   class="px-2 py-0.5 border border-neutral-300 hover:border-black rounded text-[11px] font-mono text-neutral-700 hover:text-black transition inline-flex items-center space-x-1">
                                    <span>Xem trang cá nhân</span>
                                    <span>↗</span>
                                </a>
                            </div>
                            <div class="text-xs text-neutral-700 font-medium" x-text="selectedLead.full_name || 'Chưa cập nhật họ tên'"></div>
                            <div class="text-[11px] text-neutral-500 leading-relaxed max-w-xl" x-text="selectedLead.bio || 'Không có tiểu sử'"></div>
                        </div>

                        <!-- Các chỉ số chính -->
                        <div class="flex sm:flex-col items-end gap-1.5 text-xs font-mono shrink-0">
                            <div class="text-neutral-700">
                                <b><span x-text="formatNumber(selectedLead.followers)"></span></b> Người theo dõi
                            </div>
                            <div class="text-neutral-500 text-[11px]">
                                <b><span x-text="selectedLead.reels_last_30d || 0"></span></b> Reels trong 30 ngày
                            </div>
                            <div class="text-[10px] text-neutral-400" x-text="selectedLead.detected_industry || selectedLead.category_name || 'Chưa phân loại ngành'"></div>
                        </div>
                    </div>


                    <!-- 2. ĐÁNH GIÁ NHU CẦU TỪ AI (GỒM 4 THANH TIÊU CHÍ & ĐIỂM LƯU Ý BẮT CHUYỆN) -->
                    <div class="bg-white border border-neutral-200 rounded p-4 shadow-sm space-y-3.5">
                        <div class="flex items-center justify-between border-b border-neutral-100 pb-2.5">
                            <div class="flex items-center space-x-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                                <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-900">Đánh giá Nhu cầu từ AI</h3>
                            </div>
                            <div class="font-mono text-xs font-bold flex items-center space-x-1.5">
                                <span class="text-neutral-500 text-[11px]">Tổng điểm:</span>
                                <span class="px-2 py-0.5 rounded text-xs border"
                                      :class="{
                                          'bg-emerald-50 text-emerald-800 border-emerald-300': (selectedLead.fit_score || 0) >= 80,
                                          'bg-blue-50 text-blue-800 border-blue-200': (selectedLead.fit_score || 0) >= 65 && (selectedLead.fit_score || 0) < 80,
                                          'bg-neutral-100 text-neutral-700 border-neutral-200': (selectedLead.fit_score || 0) < 65
                                      }">
                                    <span x-text="selectedLead.fit_score || 0"></span> / 100
                                </span>
                            </div>
                        </div>

                        <!-- 4 Thanh tiến trình tiêu chí thành phần (Thang điểm 100) -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-mono">
                            <div>
                                <div class="flex justify-between text-[11px] mb-1 text-neutral-600">
                                    <span>1. Cam kết làm video:</span>
                                    <span class="font-bold" x-text="(selectedLead.score_breakdown_parsed?.video_volume || 0) + '/100'"></span>
                                </div>
                                <div class="w-full bg-neutral-200 rounded-full h-1.5">
                                    <div class="bg-black h-1.5 rounded-full" :style="'width: ' + Math.min(100, (selectedLead.score_breakdown_parsed?.video_volume || 0)) + '%'"></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between text-[11px] mb-1 text-neutral-600">
                                    <span>2. Nhu cầu tối ưu giữ chân &amp; Hook:</span>
                                    <span class="font-bold" x-text="(selectedLead.score_breakdown_parsed?.engagement_gap || 0) + '/100'"></span>
                                </div>
                                <div class="w-full bg-neutral-200 rounded-full h-1.5">
                                    <div class="bg-black h-1.5 rounded-full" :style="'width: ' + Math.min(100, (selectedLead.score_breakdown_parsed?.engagement_gap || 0)) + '%'"></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between text-[11px] mb-1 text-neutral-600">
                                    <span>3. Khả năng chi trả:</span>
                                    <span class="font-bold" x-text="(selectedLead.score_breakdown_parsed?.monetization || 0) + '/100'"></span>
                                </div>
                                <div class="w-full bg-neutral-200 rounded-full h-1.5">
                                    <div class="bg-black h-1.5 rounded-full" :style="'width: ' + Math.min(100, (selectedLead.score_breakdown_parsed?.monetization || 0)) + '%'"></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between text-[11px] mb-1 text-neutral-600">
                                    <span>4. Dấu hiệu thiếu thời gian tự dựng:</span>
                                    <span class="font-bold" x-text="(selectedLead.score_breakdown_parsed?.capacity_bottleneck || 0) + '/100'"></span>
                                </div>
                                <div class="w-full bg-neutral-200 rounded-full h-1.5">
                                    <div class="bg-black h-1.5 rounded-full" :style="'width: ' + Math.min(100, (selectedLead.score_breakdown_parsed?.capacity_bottleneck || 0)) + '%'"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Khung Điểm Lưu Ý Khi Trò Chuyện (Được định dạng ngắn gọn, súc tích) -->
                        <div class="bg-neutral-50 border border-neutral-200 rounded p-3 text-xs space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-[11px] uppercase tracking-wider text-neutral-800 font-mono">
                                    Điểm lưu ý khi bắt chuyện (Gợi ý từ AI):
                                </span>
                                <span class="text-[10px] text-neutral-400 font-mono">Đọc trong 3 giây</span>
                            </div>

                            <div class="space-y-2">
                                <template x-for="(point, idx) in (selectedLead.ai_evidence_parsed || [])" :key="idx">
                                    <div class="p-2.5 bg-white rounded border border-neutral-200/90 shadow-2xs space-y-1">
                                        <div class="flex items-center space-x-1.5">
                                            <span class="w-1.5 h-1.5 rounded-full bg-black"></span>
                                            <span class="font-bold text-[11px] text-neutral-900" x-text="getEvidenceTitle(point)"></span>
                                        </div>
                                        <p class="text-neutral-700 text-xs leading-relaxed" x-text="getEvidenceText(point)"></p>
                                        <template x-if="point && point.excerpt">
                                            <p class="text-[10px] text-neutral-500 bg-neutral-50 px-2 py-1 rounded border border-neutral-100 font-mono">
                                                <span class="font-bold text-neutral-600">Dẫn chứng:</span> "<span x-text="point.excerpt"></span>"
                                            </p>
                                        </template>
                                    </div>
                                </template>

                                <template x-if="!selectedLead.ai_evidence_parsed || selectedLead.ai_evidence_parsed.length === 0">
                                    <p class="text-neutral-400 italic text-[11px]">
                                        Khách hàng có tiềm năng tốt, nên đề xuất dựng thử 1 video ngắn từ video cũ để chứng minh nhịp cắt và hiệu ứng hook 3 giây đầu.
                                    </p>
                                </template>
                            </div>
                        </div>
                    </div>


                    <!-- 3. KỊCH BẢN TIN NHẮN CHÀO HỎI GỢI Ý & TIẾP CẬN NHANH -->
                    <div class="bg-white border border-neutral-200 rounded p-4 shadow-sm space-y-3">
                        <div class="flex items-center justify-between border-b border-neutral-100 pb-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-900">Kịch Bản Tin Nhắn Chào Hỏi Gợi Ý</h3>
                            <span class="text-[11px] font-mono text-neutral-400">AI tạo sẵn riêng cho khách này</span>
                        </div>

                        <!-- Khung soạn và xem trước tin nhắn -->
                        <div>
                            <textarea x-model="selectedLead.suggested_dm" rows="4"
                                      placeholder="Nội dung tin nhắn chào hỏi gửi khách hàng..."
                                      class="w-full text-xs font-sans p-3 border border-neutral-300 rounded focus:outline-none focus:border-black leading-relaxed"></textarea>
                        </div>

                        <!-- Các nút thao tác tiếp cận -->
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">
                            <button @click="copyDmAndOpenChat(selectedLead)"
                                    class="flex-1 py-2.5 px-4 bg-black hover:bg-neutral-800 text-white rounded text-xs font-bold transition flex items-center justify-center space-x-2 shadow-sm">
                                <span>⚡</span>
                                <span>Sao chép tin nhắn &amp; Mở hộp thư Instagram</span>
                                <span class="text-neutral-400 font-mono text-[11px]">(ig.me/m/...)</span>
                            </button>

                            <button @click="copyOnlyDm(selectedLead.suggested_dm)"
                                    class="py-2.5 px-3 border border-neutral-300 hover:border-black rounded text-xs font-medium bg-white text-neutral-700 transition">
                                Chỉ sao chép tin nhắn
                            </button>
                        </div>
                        <p class="text-[10px] text-neutral-400 italic">
                            * Bấm nút sẽ tự động sao chép tin nhắn vào máy, mở hộp thư Instagram của khách, chuyển trạng thái sang "Đã gửi tin" và đặt lịch nhắc lại sau 3 ngày.
                        </p>
                    </div>


                    <!-- 4. TIẾN ĐỘ CHĂM SÓC KHÁCH HÀNG (QUY TRÌNH BÁN HÀNG) -->
                    <div class="bg-white border border-neutral-200 rounded p-4 shadow-sm space-y-3.5">
                        <div class="flex items-center justify-between border-b border-neutral-100 pb-2">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-neutral-900">Tiến Độ Chăm Sóc Khách Hàng</h3>
                            <span class="text-[11px] font-mono text-neutral-400" x-text="'Cập nhật lúc: ' + (selectedLead.updated_at || 'Mới')"></span>
                        </div>

                        <!-- Lựa chọn trạng thái chăm sóc -->
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-neutral-700">Trạng thái chăm sóc:</label>
                            <div class="grid grid-cols-2 sm:grid-cols-6 gap-1.5 text-xs font-mono">
                                <button type="button" @click="selectedLead.sale_status = 'New'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'New' ? 'bg-black text-white border-black' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Mới
                                </button>
                                <button type="button" @click="selectedLead.sale_status = 'Contacted'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'Contacted' ? 'bg-blue-600 text-white border-blue-600' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Đã gửi tin
                                </button>
                                <button type="button" @click="selectedLead.sale_status = 'In_Discussion'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'In_Discussion' ? 'bg-amber-600 text-white border-amber-600' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Đang trao đổi
                                </button>
                                <button type="button" @click="selectedLead.sale_status = 'Demo_Sent'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'Demo_Sent' ? 'bg-purple-600 text-white border-purple-600' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Đã gửi video mẫu
                                </button>
                                <button type="button" @click="selectedLead.sale_status = 'Won'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'Won' ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Chốt đơn thành công ★
                                </button>
                                <button type="button" @click="selectedLead.sale_status = 'Lost'"
                                        class="py-1.5 px-2 rounded border text-center transition font-bold"
                                        :class="selectedLead.sale_status === 'Lost' ? 'bg-rose-600 text-white border-rose-600' : 'bg-neutral-50 text-neutral-700 border-neutral-200 hover:bg-neutral-100'">
                                    Từ chối
                                </button>
                            </div>
                        </div>

                        <!-- Lịch hẹn nhắc lại & Người phụ trách -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                            <div>
                                <label class="block font-semibold text-neutral-700 mb-1">Lịch hẹn liên hệ lại:</label>
                                <input type="datetime-local" x-model="selectedLead.follow_up_at"
                                       class="w-full border border-neutral-300 rounded px-3 py-1.5 font-mono focus:outline-none focus:border-black">
                            </div>

                            <div>
                                <label class="block font-semibold text-neutral-700 mb-1">Người phụ trách:</label>
                                <input type="text" x-model="selectedLead.sale_assigned_to" placeholder="Ví dụ: Hoàng Nam"
                                       class="w-full border border-neutral-300 rounded px-3 py-1.5 font-sans focus:outline-none focus:border-black">
                            </div>
                        </div>

                        <!-- Ghi chú trao đổi -->
                        <div class="space-y-1">
                            <label class="block text-xs font-semibold text-neutral-700">Ghi chú trao đổi (Nhu cầu, phản hồi của khách, hẹn báo giá):</label>
                            <textarea x-model="selectedLead.sale_note" rows="2"
                                      placeholder="Ghi chú nhanh: Khách hẹn thứ 6 gửi video gốc, thích phong cách cắt nhịp nhanh..."
                                      class="w-full text-xs font-sans p-2.5 border border-neutral-300 rounded focus:outline-none focus:border-black"></textarea>
                        </div>

                        <!-- Nút lưu tiến độ -->
                        <div class="flex justify-end pt-2">
                            <button @click="saveLeadProgress(selectedLead)" :disabled="isSaving"
                                    class="py-2 px-6 bg-black hover:bg-neutral-800 text-white rounded text-xs font-bold transition shadow-sm disabled:opacity-50 flex items-center space-x-1.5">
                                <span x-show="isSaving" class="inline-block animate-spin mr-1">↻</span>
                                <span x-text="isSaving ? 'Đang lưu lên máy chủ...' : 'Lưu tiến độ chăm sóc'"></span>
                            </button>
                        </div>
                    </div>

                </div>
            </template>
        </section>

    </main>

    <!-- XỬ LÝ DỮ LIỆU BẰNG ALPINE.JS -->
    <script>
        function salesApp() {
            return {
                currentTab: 'today',
                searchQuery: '',
                scoreFilter: 'all',
                leads: [],
                filteredLeads: [],
                selectedLead: null,
                stats: { today_due: 0, new: 0, active: 0, won: 0, total: 0 },
                isLoading: false,
                isSaving: false,
                mobileDetailOpen: false,
                toastShow: false,
                toastMsg: '',
                toastType: 'info',

                showToast(msg, type = 'info', duration = 4000) {
                    this.toastMsg = msg;
                    this.toastType = type;
                    this.toastShow = true;
                    setTimeout(() => { this.toastShow = false; }, duration);
                },

                formatNumber(num) {
                    if (!num) return '0';
                    return Number(num).toLocaleString('vi-VN');
                },

                getSaleStatusLabel(st) {
                    const map = {
                        'New': 'Mới tiếp nhận',
                        'Contacted': 'Đã gửi tin',
                        'In_Discussion': 'Đang trao đổi',
                        'Demo_Sent': 'Đã gửi video mẫu',
                        'Won': 'Chốt đơn thành công ★',
                        'Lost': 'Từ chối'
                    };
                    return map[st] || st || 'Mới';
                },

                getEvidenceTitle(point) {
                    if (!point) return 'Gợi ý bắt chuyện';
                    const c = point.criterion || '';
                    if (c === 'retention_need') return 'Nhu cầu tối ưu giữ chân & Hook';
                    if (c === 'monetization_budget') return 'Khả năng chi trả & Phễu bán hàng';
                    if (c === 'video_volume') return 'Tần suất đăng tải video';
                    if (c === 'capacity_bottleneck') return 'Dấu hiệu quá tải tự dựng';
                    if (c === 'intent_hiring') return 'Tín hiệu cần tìm Editor';
                    return 'Điểm đáng chú ý';
                },

                getEvidenceText(point) {
                    if (!point) return '';
                    if (typeof point === 'string') return point;
                    return point.reasoning || point.detail || point.point || '';
                },

                async initApp() {
                    await Promise.all([this.loadStats(), this.loadLeads()]);
                },

                switchTab(tab) {
                    this.currentTab = tab;
                    this.loadLeads();
                },

                async loadStats() {
                    try {
                        const res = await fetch('/api/stats');
                        const data = await res.json();
                        if (data.success && data.stats) {
                            this.stats = data.stats;
                        }
                    } catch (e) {
                        console.warn('Could not load stats:', e);
                    }
                },

                async loadLeads() {
                    this.isLoading = true;
                    try {
                        const params = new URLSearchParams();
                        params.set('tab', this.currentTab);
                        if (this.searchQuery.trim()) {
                            params.set('search', this.searchQuery.trim());
                        }

                        const res = await fetch('/api/leads?' + params.toString());
                        const data = await res.json();
                        if (data.success) {
                            this.leads = data.leads || [];
                            this.applyLocalFilters();
                            
                            // Tự động chọn khách hàng đầu tiên nếu chưa chọn
                            if (!this.selectedLead && this.filteredLeads.length > 0) {
                                this.selectedLead = this.filteredLeads[0];
                            } else if (this.selectedLead) {
                                const found = this.filteredLeads.find(l => l.username === this.selectedLead.username);
                                if (found) this.selectedLead = found;
                            }
                        } else {
                            this.showToast(data.error || 'Lỗi tải dữ liệu từ máy chủ', 'error');
                        }
                    } catch (e) {
                        this.showToast('Lỗi kết nối khi tải khách hàng: ' + e, 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                applyLocalFilters() {
                    let list = [...this.leads];
                    if (this.scoreFilter === '80') {
                        list = list.filter(l => (l.fit_score || 0) >= 80);
                    } else if (this.scoreFilter === '65') {
                        list = list.filter(l => (l.fit_score || 0) >= 65);
                    }
                    this.filteredLeads = list;
                },

                selectLead(lead) {
                    this.selectedLead = lead;
                    this.mobileDetailOpen = true;
                },

                async copyDmAndOpenChat(lead) {
                    if (!lead) return;
                    const dmText = lead.suggested_dm || '';
                    
                    // 1. Sao chép tin nhắn vào bộ nhớ tạm
                    try {
                        await navigator.clipboard.writeText(dmText);
                    } catch (err) {
                        const ta = document.createElement('textarea');
                        ta.value = dmText;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }

                    // 2. Mở hộp thư Instagram trong tab mới
                    const igUrl = `https://ig.me/m/${lead.username}`;
                    window.open(igUrl, '_blank');

                    // 3. Tự động đổi trạng thái sang "Đã gửi tin" và lên lịch nhắc sau 3 ngày
                    lead.sale_status = 'Contacted';
                    lead.contacted_at = new Date().toISOString().slice(0, 19).replace('T', ' ');
                    
                    const next3Days = new Date();
                    next3Days.setDate(next3Days.getDate() + 3);
                    lead.follow_up_at = next3Days.toISOString().slice(0, 16);

                    // 4. Lưu lên máy chủ D1
                    await this.saveLeadProgress(lead, false);

                    this.showToast(`Đã sao chép tin nhắn & mở hộp thư @${lead.username}!`, 'success', 5000);
                },

                async copyOnlyDm(text) {
                    if (!text) return;
                    try {
                        await navigator.clipboard.writeText(text);
                        this.showToast('Đã sao chép tin nhắn vào bộ nhớ tạm!', 'success');
                    } catch (e) {
                        this.showToast('Lỗi sao chép: ' + e, 'error');
                    }
                },

                async saveLeadProgress(lead, showFeedback = true) {
                    if (!lead) return;
                    this.isSaving = true;
                    try {
                        const payload = {
                            id: lead.id,
                            username: lead.username,
                            sale_status: lead.sale_status,
                            sale_tag: lead.sale_tag,
                            sale_note: lead.sale_note,
                            sale_assigned_to: lead.sale_assigned_to,
                            follow_up_at: lead.follow_up_at,
                            contacted_at: lead.contacted_at
                        };

                        const res = await fetch('/api/leads', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (data.success) {
                            if (showFeedback) {
                                this.showToast('Đã lưu tiến độ chăm sóc khách hàng thành công!', 'success');
                            }
                            this.loadStats();
                        } else {
                            this.showToast(data.error || 'Lỗi lưu tiến độ', 'error');
                        }
                    } catch (e) {
                        this.showToast('Lỗi lưu: ' + e, 'error');
                    } finally {
                        this.isSaving = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
